name: Build AI Muhandis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          cp lib/lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name ai_muhandis .
          cp /tmp/main.dart lib/main.dart

      - name: Set Android compileSdk 36
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          grep "compileSdk" android/app/build.gradle.kts

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Muhandis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
