name: Build AI Muhandis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          cp lib/lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name ai_muhandis .
          cp /tmp/main.dart lib/main.dart

      - name: Force Android API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("build.gradle.kts"):
              text = p.read_text()
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )
              p.write_text(text)

          for p in Path(".").rglob("build.gradle"):
              text = p.read_text()
              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )
              p.write_text(text)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Muhandis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
